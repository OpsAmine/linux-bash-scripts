<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Linux System Administration Scripts</title>
  <desc id="desc">Infrastructure-as-code automation in Bash</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1B4A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Soft highlight circles for depth -->
  <circle cx="1060" cy="40" r="170" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="120" cy="300" r="140" fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- Light waves -->
  <path d="M0,270 C250,305 520,250 800,268 C980,280 1100,255 1200,242 L1200,320 L0,320 Z" fill="#FFFFFF" fill-opacity="0.14"/>
  <path d="M0,295 C300,318 650,278 1200,292 L1200,320 L0,320 Z" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Title -->
  <text x="600" y="150" text-anchor="middle" filter="url(#soft)"
        font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="700" fill="#FFFFFF">Linux Automation Scripts</text>

  <!-- Accent line -->
  <rect x="540" y="176" width="120" height="5" rx="2.5" fill="#FDE68A"/>

  <!-- Subtitle -->
  <text x="600" y="224" text-anchor="middle"
        font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="600" fill="#F0F9FF">Infrastructure-as-code automation in Bash</text>
</svg>
